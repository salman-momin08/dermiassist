<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="erdHead1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="erdHead2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="erdHead3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="erdHead4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Supabase PostgreSQL Schema &amp; Entity Relationship Diagram (ERD)</text>
  <text x="480" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Persistent Relational Core + 768-dimensional pgvector Clinical Knowledge Base</text>

  <!-- Table 1: PROFILES -->
  <g transform="translate(40, 90)">
    <rect width="260" height="230" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="260" height="36" rx="8" fill="url(#erdHead1)"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">PROFILES</text>
    <text x="15" y="60" fill="#60a5fa" font-size="11" font-weight="600">PK  id: uuid</text>
    <text x="15" y="82" fill="#cbd5e1" font-size="11">full_name: text</text>
    <text x="15" y="104" fill="#cbd5e1" font-size="11">role: 'patient' | 'doctor' | 'admin'</text>
    <text x="15" y="126" fill="#cbd5e1" font-size="11">avatar_url: text</text>
    <text x="15" y="148" fill="#cbd5e1" font-size="11">phone_number: text</text>
    <text x="15" y="170" fill="#cbd5e1" font-size="11">medical_history: jsonb</text>
    <text x="15" y="192" fill="#cbd5e1" font-size="11">created_at: timestamp</text>
    <text x="15" y="214" fill="#cbd5e1" font-size="11">updated_at: timestamp</text>
  </g>

  <!-- Table 2: ANALYSES -->
  <g transform="translate(350, 90)">
    <rect width="260" height="230" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="260" height="36" rx="8" fill="url(#erdHead2)"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">ANALYSES</text>
    <text x="15" y="60" fill="#c084fc" font-size="11" font-weight="600">PK  id: uuid</text>
    <text x="15" y="82" fill="#a855f7" font-size="11" font-weight="600">FK  user_id: uuid</text>
    <text x="15" y="104" fill="#cbd5e1" font-size="11">detected_condition: text</text>
    <text x="15" y="126" fill="#cbd5e1" font-size="11">icd_10_code: text</text>
    <text x="15" y="148" fill="#cbd5e1" font-size="11">severity: 'Mild' | 'Moderate' | 'Severe'</text>
    <text x="15" y="170" fill="#cbd5e1" font-size="11">dos &amp; donts: jsonb</text>
    <text x="15" y="192" fill="#cbd5e1" font-size="11">recommendations: text</text>
    <text x="15" y="214" fill="#cbd5e1" font-size="11">conversation_transcript: jsonb</text>
  </g>

  <!-- Table 3: APPOINTMENTS -->
  <g transform="translate(660, 90)">
    <rect width="260" height="230" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="260" height="36" rx="8" fill="url(#erdHead3)"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">APPOINTMENTS</text>
    <text x="15" y="60" fill="#34d399" font-size="11" font-weight="600">PK  id: uuid</text>
    <text x="15" y="82" fill="#10b981" font-size="11" font-weight="600">FK  patient_id: uuid</text>
    <text x="15" y="104" fill="#10b981" font-size="11" font-weight="600">FK  doctor_id: uuid</text>
    <text x="15" y="126" fill="#cbd5e1" font-size="11">appointment_date: timestamp</text>
    <text x="15" y="148" fill="#cbd5e1" font-size="11">appointment_mode: 'Video' | 'In-Person'</text>
    <text x="15" y="170" fill="#cbd5e1" font-size="11">status: 'Pending' | 'Confirmed' | ...</text>
    <text x="15" y="192" fill="#cbd5e1" font-size="11">meeting_room_id: text</text>
    <text x="15" y="214" fill="#cbd5e1" font-size="11">doctor_prescription: text</text>
  </g>

  <!-- Table 4: DOCTORS -->
  <g transform="translate(40, 360)">
    <rect width="260" height="220" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="260" height="36" rx="8" fill="url(#erdHead4)"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">DOCTORS</text>
    <text x="15" y="60" fill="#fbbf24" font-size="11" font-weight="600">PK  id: uuid</text>
    <text x="15" y="82" fill="#f59e0b" font-size="11" font-weight="600">FK  user_id: uuid</text>
    <text x="15" y="104" fill="#cbd5e1" font-size="11">specialization: text</text>
    <text x="15" y="126" fill="#cbd5e1" font-size="11">license_number: text</text>
    <text x="15" y="148" fill="#cbd5e1" font-size="11">years_of_experience: int</text>
    <text x="15" y="170" fill="#cbd5e1" font-size="11">consultation_fee: numeric</text>
    <text x="15" y="192" fill="#cbd5e1" font-size="11">is_verified: boolean</text>
    <text x="15" y="214" fill="#cbd5e1" font-size="11">available_slots: jsonb</text>
  </g>

  <!-- Table 5: KNOWLEDGE_CHUNKS (pgvector) -->
  <g transform="translate(350, 360)">
    <rect width="260" height="220" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="260" height="36" rx="8" fill="#0e7490"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">KNOWLEDGE_CHUNKS</text>
    <text x="15" y="60" fill="#22d3ee" font-size="11" font-weight="600">PK  id: uuid</text>
    <text x="15" y="82" fill="#cbd5e1" font-size="11">title: text</text>
    <text x="15" y="104" fill="#cbd5e1" font-size="11">condition_category: text</text>
    <text x="15" y="126" fill="#cbd5e1" font-size="11">content: text</text>
    <text x="15" y="148" fill="#cbd5e1" font-size="11">icd_code: text</text>
    <text x="15" y="170" fill="#38bdf8" font-size="11" font-weight="700">embedding: vector(768)</text>
    <text x="15" y="192" fill="#cbd5e1" font-size="11">source_citation: text</text>
    <text x="15" y="214" fill="#cbd5e1" font-size="11">created_at: timestamp</text>
  </g>

  <!-- Table 6: DOCTOR_REVIEWS & REQUESTS -->
  <g transform="translate(660, 360)">
    <rect width="260" height="220" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="260" height="36" rx="8" fill="#9d174d"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">DOCTOR_REVIEWS &amp; REQUESTS</text>
    <text x="15" y="60" fill="#f472b6" font-size="11" font-weight="600">PK  id: uuid</text>
    <text x="15" y="82" fill="#ec4899" font-size="11" font-weight="600">FK  doctor_id / user_id: uuid</text>
    <text x="15" y="104" fill="#cbd5e1" font-size="11">rating: 1 - 5</text>
    <text x="15" y="126" fill="#cbd5e1" font-size="11">review_text: text</text>
    <text x="15" y="148" fill="#cbd5e1" font-size="11">request_type: text</text>
    <text x="15" y="170" fill="#cbd5e1" font-size="11">status: 'Open' | 'In Review' | ...</text>
    <text x="15" y="192" fill="#cbd5e1" font-size="11">payload: jsonb</text>
    <text x="15" y="214" fill="#cbd5e1" font-size="11">created_at: timestamp</text>
  </g>

  <!-- Relationship Connectors -->
  <path d="M 300 150 L 350 150" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3"/>
  <path d="M 610 150 L 660 150" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3"/>
  <path d="M 170 320 L 170 360" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3"/>
</svg>
